# blank_issues_enabled stays TRUE on purpose. Templates help people who want structure; forcing
# everyone through a form turns away the person whose report doesn't fit a category, and that
# report is often the interesting one.
blank_issues_enabled: true
contact_links:
  - name: Security problem
    url: https://github.com/brijeshsingaravel/shadow-joyboy/blob/main/SECURITY.md
    about: Please report privately rather than in a public issue — there's an address in here.
  # Discussions was switched on after publication, and this link was verified to return 200
  # before being added. It was deliberately absent for a few hours while the tab was disabled,
  # because a contact link pointing at a disabled tab is a 404 on someone's first click.
  - name: A question, or an idea for a large change
    url: https://github.com/brijeshsingaravel/shadow-joyboy/discussions
    about: Lower stakes than an issue. Worth asking before you build something large.
