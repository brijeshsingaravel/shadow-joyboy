capability_summary: "Invoke when a new lead enters any inbound channel\u2014email,\
  \ chat, form, or referral\u2014and the goal is to determine fit, interest level,\
  \ and calendar availability before a human ever touches it. Also invoke when rescheduling\
  \ or re-qualifying existing prospects."
