[project]
name = "tamil-lang"
version = "0.0.1"
description = "The open .tamil front-end (RFC-0002, D9): Kural (the kernel grammar) + Ezhuthu (the grammar-as-tokenizer). Apache-2.0."
requires-python = ">=3.11,<3.12"
dependencies = [
  "lark>=1.1",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tamil_lang"]

[tool.hatch.build.targets.wheel.force-include]
"src/tamil_lang/kural.lark" = "tamil_lang/kural.lark"
"src/tamil_lang/kural.gbnf" = "tamil_lang/kural.gbnf"
